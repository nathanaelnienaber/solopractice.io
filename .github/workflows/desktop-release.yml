name: desktop-release

# Builds the SoloPractice Tauri desktop app for macOS, Windows, and Linux,
# and publishes unsigned installers to a GitHub Release.
#
# Trial-scope decisions (see apps/desktop MVP Scope doc):
#   - Installers are UNSIGNED. macOS Gatekeeper and Windows SmartScreen will
#     warn the user on first launch — this is documented for the trial user,
#     not a bug to silently fix tonight.
#   - No auto-updater wiring (plugins.updater is intentionally absent from
#     tauri.conf.json). Each release is a manual download/replace.
#   - Triggered by pushing a `v*` tag, or manually via workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundler deps (webkit2gtk, appindicator, GStreamer, rpm/deb tooling)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # GStreamer plugins are required on the *build* host when
          # tauri.conf.json sets bundle.linux.appimage.bundleMediaFramework
          # so the AppImage can capture the mic via WebKitGTK on Arch/Omarchy
          # (host plugins alone are ABI-mismatched with the bundled core).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file \
            build-essential \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @solopractice/shared
        run: pnpm --filter @solopractice/shared build

      # Bundle whisper.cpp CLI + ggml-base.en (~150MB) so Record → Transcribe → SOAP
      # works out of the box. Fetched at build time (not committed). See
      # apps/desktop/scripts/fetch-whisper-bundle.sh for size notes.
      - name: Fetch bundled speech-to-text (whisper.cpp + base.en)
        shell: bash
        run: |
          chmod +x apps/desktop/scripts/fetch-whisper-bundle.sh
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            apps/desktop/scripts/fetch-whisper-bundle.sh windows
          elif [[ "${{ matrix.platform }}" == "ubuntu-latest" ]]; then
            apps/desktop/scripts/fetch-whisper-bundle.sh linux
          else
            # macOS: no official prebuilt whisper-cli archive — script builds from
            # source (Metal embedded) for the runner arch (macos-latest = Apple Silicon).
            apps/desktop/scripts/fetch-whisper-bundle.sh macos
          fi
          du -sh apps/desktop/src-tauri/resources/whisper || true

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('trial-build-{0}', github.run_number) }}
          releaseName: "SoloPractice Desktop ${{ github.ref_type == 'tag' && github.ref_name || format('trial build {0}', github.run_number) }}"
          releaseBody: |
            Trial build of the SoloPractice desktop app for macOS, Windows, and Linux.

            **Speech-to-text bundled (v0.1.8+):** whisper.cpp CLI + `ggml-base.en` (~150MB)
            ship inside the AppImage, Windows installer, and macOS `.dmg` / `.app`
            (Apple Silicon) so the first Record → Transcribe → SOAP path works
            without a separate download. Continue transcription UX from v0.1.7
            is unchanged.

            **Unsigned installers** — this is expected for the trial:
            - macOS: Gatekeeper will say the app is from an unidentified developer.
              Right-click (or Control-click) the app → Open, then confirm.
              Mac build is Apple Silicon (aarch64) only; no Intel .dmg yet.
            - Windows: SmartScreen will show "Windows protected your PC".
              Click "More info" → "Run anyway".
            - Linux: AppImage just needs `chmod +x` then run; .deb installs via
              `sudo dpkg -i` or your package manager's installer.

            No auto-update yet — download a new installer for each new build.
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
